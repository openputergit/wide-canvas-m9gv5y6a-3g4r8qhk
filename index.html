<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkSmart AI - Task Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: #e0e5ec;
            min-height: 100vh;
        }
        .neo-box {
            border-radius: 24px;
            background: #e0e5ec;
            box-shadow: 20px 20px 60px #bec3c9,
                       -20px -20px 60px #ffffff;
            transition: all 0.3s ease;
        }
        .neo-box:hover {
            box-shadow: 25px 25px 75px #bec3c9,
                       -25px -25px 75px #ffffff;
            transform: translateY(-2px);
        }
        .neo-button {
            border-radius: 16px;
            background: #e0e5ec;
            box-shadow: 5px 5px 10px #bec3c9,
                       -5px -5px 10px #ffffff;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .neo-button:hover {
            transform: translateY(-2px);
            box-shadow: 7px 7px 15px #bec3c9,
                       -7px -7px 15px #ffffff;
        }
        .neo-button:active {
            transform: translateY(0);
            box-shadow: inset 5px 5px 10px #bec3c9,
                       inset -5px -5px 10px #ffffff;
        }
        .neo-button.primary {
            background: #2563eb;
            color: white;
            box-shadow: 5px 5px 10px #1d4ed8,
                       -5px -5px 10px #3b82f6;
        }
        .neo-button.primary:hover {
            background: #1d4ed8;
        }
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 250px;
            background: #e0e5ec;
            box-shadow: 5px 0 15px #bec3c9;
            z-index: 1000;
            transition: all 0.3s ease;
            overflow-y: auto;
        }
        
        .sidebar-header {
            padding: 1.5rem;
            text-align: center;
            border-bottom: 2px solid rgba(156, 163, 175, 0.2);
        }
        
        .sidebar-nav {
            padding: 1rem;
        }
        
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: #4b5563;
            border-radius: 12px;
            transition: all 0.3s ease;
            margin-bottom: 0.5rem;
            text-decoration: none;
        }
        
        .sidebar-link:hover {
            background: #d1d5db;
            color: #1f2937;
        }
        
        .sidebar-link.active {
            background: #3b82f6;
            color: white;
        }
        
        .sidebar-link i {
            font-size: 1.25rem;
        }
        
        .main-content {
            margin-left: 250px;
            padding: 2rem;
            transition: all 0.3s ease;
        }
        
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            
            .sidebar.show {
                transform: translateX(0);
            }
            
            .main-content {
                margin-left: 0;
            }
        }
        .kanban-column {
            min-width: 320px;
            max-width: 320px;
            height: calc(100vh - 200px);
            overflow-y: auto;
            margin: 10px;
            padding: 20px;
            background: #e0e5ec;
            border-radius: 16px;
            box-shadow: 5px 5px 10px #bec3c9, -5px -5px 10px #ffffff;
            transition: all 0.3s ease;
        }

        .kanban-column.collapsed {
            min-width: 60px;
            max-width: 60px;
            padding: 10px;
        }

        .kanban-column.collapsed .column-content,
        .kanban-column.collapsed .task-count {
            display: none;
        }

        .kanban-column.collapsed .column-header {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            white-space: nowrap;
            margin-top: 20px;
        }

        .task-card {
            margin-bottom: 16px;
            padding: 16px;
            border-radius: 12px;
            background: #e0e5ec;
            box-shadow: 3px 3px 6px #bec3c9, -3px -3px 6px #ffffff;
            transition: all 0.3s ease;
            cursor: grab;
            position: relative;
            overflow: hidden;
        }

        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: 5px 5px 10px #bec3c9, -5px -5px 10px #ffffff;
        }

        .task-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
        }

        .task-card.priority-high::before { background-color: #ef4444; }
        .task-card.priority-medium::before { background-color: #f59e0b; }
        .task-card.priority-low::before { background-color: #10b981; }

        .task-progress {
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            overflow: hidden;
        }

        .task-progress-bar {
            height: 100%;
            background: #3b82f6;
            transition: width 0.3s ease;
        }

        .assignee-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
            position: relative;
        }

        .assignee-tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            z-index: 10;
        }

        .assignee-avatar:hover .assignee-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(-4px);
        }

        .attachment-preview {
            max-width: 100px;
            max-height: 100px;
            border-radius: 8px;
            object-fit: cover;
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .column-actions {
            display: flex;
            gap: 8px;
        }

        .column-toggle {
            padding: 4px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .column-toggle:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        /* Rich Text Editor Styles */
        .ql-toolbar {
            border-radius: 12px 12px 0 0;
            border: none !important;
            background: #e0e5ec;
            box-shadow: inset 3px 3px 6px #bec3c9, inset -3px -3px 6px #ffffff;
        }

        .ql-container {
            border-radius: 0 0 12px 12px;
            border: none !important;
            background: #e0e5ec;
            box-shadow: inset 3px 3px 6px #bec3c9, inset -3px -3px 6px #ffffff;
        }

        /* Custom Scrollbar */
        .kanban-column::-webkit-scrollbar {
            width: 8px;
        }

        .kanban-column::-webkit-scrollbar-track {
            background: transparent;
        }

        .kanban-column::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .kanban-column::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Add space specifically for task cards */
        .kanban-column .space-y-4 {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar fixed left-0 top-0 bottom-0 w-64 bg-[#e0e5ec] shadow-lg z-50 transition-transform duration-300 transform -translate-x-full lg:translate-x-0">
        <div class="p-4 border-b border-gray-200">
            <h2 class="text-xl font-bold text-gray-800">WorkSmart AI</h2>
        </div>
        <nav class="p-4">
            <a href="employee-dashboard.html" class="flex items-center gap-3 p-3 text-gray-700 rounded-lg hover:bg-gray-100 mb-2">
                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>
            </a>
            <a href="attandance.html" class="flex items-center gap-3 p-3 text-gray-700 rounded-lg hover:bg-gray-100 mb-2">
                <i class="bi bi-calendar-check"></i>
                <span>Attendance</span>
            </a>
            <a href="Task.html" class="flex items-center gap-3 p-3 text-gray-700 rounded-lg hover:bg-gray-100 mb-2 bg-blue-100">
                <i class="bi bi-list-task"></i>
                <span>Tasks</span>
            </a>
            <a href="leave-reimbursement.html" class="flex items-center gap-3 p-3 text-gray-700 rounded-lg hover:bg-gray-100 mb-2">
                <i class="bi bi-calendar2-check"></i>
                <span>Leave & Reimbursement</span>
            </a>
            <a href="wellbing.html" class="flex items-center gap-3 p-3 text-gray-700 rounded-lg hover:bg-gray-100 mb-2">
                <i class="bi bi-heart-pulse"></i>
                <span>Wellbeing</span>
            </a>
            <a href="prifile.html" class="flex items-center gap-3 p-3 text-gray-700 rounded-lg hover:bg-gray-100 mb-2">
                <i class="bi bi-person"></i>
                <span>Profile</span>
            </a>
            <div class="mt-8 pt-4 border-t border-gray-200">
                <button id="logoutBtn" class="flex items-center gap-3 p-3 text-red-600 rounded-lg hover:bg-red-50 w-full">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Logout</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- Mobile Toggle Button -->
    <button id="sidebarToggle" class="fixed top-4 left-4 z-50 lg:hidden p-2 rounded-lg bg-[#e0e5ec] shadow-lg">
        <i class="bi bi-list text-2xl"></i>
    </button>

    <!-- Main Content -->
    <div class="main-content">
        <div class="max-w-7xl mx-auto">
            <!-- Header with Advanced Controls -->
            <div class="neo-box p-6 mb-8">
                <div class="flex justify-between flex-wrap md:flex-nowrap items-center mb-6">
                    <div>
                        <h1 class="text-3xl font-bold text-gray-800">Task Management</h1>
                        <p class="text-lg text-gray-600">Organize and track your tasks</p>
                    </div>
                    <div class="flex gap-4 mt-4 md:mt-0">
                        <button id="addColumnBtn" class="neo-button px-4 py-2">
                            <i class="bi bi-plus-square mr-2"></i>Add Column
                        </button>
                        <button id="addTaskBtn" class="neo-button primary px-4 py-2">
                            <i class="bi bi-plus-lg mr-2"></i>Add Task
                        </button>
                    </div>
                </div>

                <!-- Advanced Filters -->
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6 mb-6">
                    <div class="neo-box p-4 text-center cursor-pointer" onclick="filterTasks('all')">
                        <div class="text-2xl font-bold text-blue-600" id="totalTasks">0</div>
                        <div class="text-sm text-gray-600">Total Tasks</div>
                    </div>
                    <div class="neo-box p-4 text-center cursor-pointer" onclick="filterTasks('inProgress')">
                        <div class="text-2xl font-bold text-yellow-600" id="inProgressTasks">0</div>
                        <div class="text-sm text-gray-600">In Progress</div>
                    </div>
                    <div class="neo-box p-4 text-center cursor-pointer" onclick="filterTasks('completed')">
                        <div class="text-2xl font-bold text-green-600" id="completedTasks">0</div>
                        <div class="text-sm text-gray-600">Completed</div>
                    </div>
                    <div class="neo-box p-4 text-center cursor-pointer" onclick="filterTasks('blocked')">
                        <div class="text-2xl font-bold text-red-600" id="blockedTasks">0</div>
                        <div class="text-sm text-gray-600">Blocked</div>
                    </div>
                </div>

                <!-- Search and Filter Controls -->
                <div class="flex flex-wrap gap-4">
                    <div class="neo-box p-3 flex items-center w-full sm:w-auto flex-1">
                        <i class="bi bi-search text-gray-500 mr-2"></i>
                        <input type="text" id="taskSearch" placeholder="Search tasks..." 
                               class="bg-transparent outline-none w-full text-gray-700">
                    </div>
                    <select id="assigneeFilter" class="neo-button p-3 text-gray-700">
                        <option value="">All Assignees</option>
                        <option value="1">John Doe</option>
                        <option value="2">Jane Smith</option>
                    </select>
                    <select id="priorityFilter" class="neo-button p-3 text-gray-700">
                        <option value="">All Priorities</option>
                        <option value="high">High Priority</option>
                        <option value="medium">Medium Priority</option>
                        <option value="low">Low Priority</option>
                    </select>
                    <select id="dateFilter" class="neo-button p-3 text-gray-700">
                        <option value="">All Dates</option>
                        <option value="today">Due Today</option>
                        <option value="week">Due This Week</option>
                        <option value="overdue">Overdue</option>
                    </select>
                    <button id="clearFilters" class="neo-button p-3">
                        <i class="bi bi-x-circle mr-2"></i>Clear Filters
                    </button>
                </div>
            </div>

            <!-- Role Switcher -->
            <div class="mb-6 flex flex-wrap gap-4">
                <button class="neo-button p-3 text-gray-700" onclick="switchRole('employee')">
                    <i class="bi bi-person mr-2"></i>Employee View
                </button>
                <button class="neo-button p-3 text-gray-700" onclick="switchRole('manager')">
                    <i class="bi bi-people mr-2"></i>Manager View
                </button>
                <button class="neo-button p-3 text-gray-700" onclick="switchRole('admin')">
                    <i class="bi bi-shield-lock mr-2"></i>Admin View
                </button>
            </div>

            <!-- Kanban Board -->
            <div id="kanbanBoard" class="flex gap-6 overflow-x-auto pb-4">
                <!-- Columns will be generated via JavaScript -->
            </div>
        </div>
    </div>

    <!-- Enhanced Task Modal -->
    <div id="taskModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="neo-box p-6 w-full max-w-2xl mx-4 bg-[#e0e5ec]">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-semibold text-gray-700" id="taskModalTitle">Add New Task</h2>
                <button id="closeTaskModal" class="text-gray-500 hover:text-gray-700">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <form id="taskForm" class="space-y-6">
                <input type="hidden" name="taskId" id="taskIdField">
                <div>
                    <label class="block text-gray-700 mb-2">Title</label>
                    <input type="text" name="title" placeholder="Task Title" 
                           class="neo-box w-full p-3 text-gray-700" required>
                </div>

                <div>
                    <label class="block text-gray-700 mb-2">Description</label>
                    <div id="editor" class="neo-box w-full h-32"></div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-700 mb-2">Priority</label>
                        <select name="priority" class="neo-box w-full p-3 text-gray-700" required>
                            <option value="">Select Priority</option>
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-700 mb-2">Status</label>
                        <select name="status" class="neo-box w-full p-3 text-gray-700" required>
                            <option value="">Select Status</option>
                            <option value="todo">To Do</option>
                            <option value="inProgress">In Progress</option>
                            <option value="completed">Completed</option>
                            <option value="blocked">Blocked</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-700 mb-2">Due Date</label>
                        <input type="text" name="dueDate" id="dueDatePicker" 
                               class="neo-box w-full p-3 text-gray-700" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 mb-2">Assignee</label>
                        <select name="assignee" class="neo-box w-full p-3 text-gray-700" required>
                            <option value="">Select Assignee</option>
                            <option value="1">John Doe</option>
                            <option value="2">Jane Smith</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-gray-700 mb-2">Progress</label>
                    <input type="range" name="progress" min="0" max="100" class="w-full" value="0" oninput="this.nextElementSibling.textContent = this.value + '%'">
                    <span class="text-sm text-gray-600">0%</span>
                </div>

                <div>
                    <label class="block text-gray-700 mb-2">Subtasks</label>
                    <div id="subtasksList" class="space-y-2">
                        <div class="flex gap-2">
                            <input type="text" class="neo-box flex-1 p-2 text-gray-700" 
                                   placeholder="Add subtask">
                            <button type="button" class="neo-button p-2" onclick="addSubtask()">
                                <i class="bi bi-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-gray-700 mb-2">Attachments</label>
                    <div class="neo-box p-4 text-center">
                        <input type="file" id="attachments" multiple class="hidden">
                        <label for="attachments" class="neo-button p-3 inline-flex items-center gap-2 cursor-pointer">
                            <i class="bi bi-upload"></i>
                            <span>Upload Files</span>
                        </label>
                        <div id="attachmentPreviews" class="flex flex-wrap gap-2 mt-4"></div>
                    </div>
                </div>

                <div class="flex justify-end gap-4">
                    <button type="button" id="cancelTask" class="neo-button px-6 py-2">Cancel</button>
                    <button type="submit" class="neo-button primary px-6 py-2">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Column Settings Modal -->
    <div id="columnModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="neo-box p-6 w-full max-w-md mx-4 bg-[#e0e5ec]">
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">Column Settings</h2>
            <form id="columnForm" class="space-y-4">
                <input type="hidden" name="columnId" id="columnIdField">
                <div>
                    <label class="block text-gray-700 mb-2">Column Title</label>
                    <input type="text" name="columnTitle" class="neo-box w-full p-3 text-gray-700" required>
                </div>
                <div>
                    <label class="block text-gray-700 mb-2">Column Color</label>
                    <input type="color" name="columnColor" class="neo-box w-full p-2">
                </div>
                <div class="flex justify-end gap-4">
                    <button type="button" id="deleteColumn" class="neo-button px-6 py-2 text-red-600">Delete</button>
                    <button type="button" id="cancelColumn" class="neo-button px-6 py-2">Cancel</button>
                    <button type="submit" class="neo-button primary px-6 py-2">Save Column</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Initialize Flatpickr for date picker
        flatpickr("#dueDatePicker", {
            enableTime: true,
            dateFormat: "Y-m-d H:i",
            minDate: "today"
        });

        // Initialize Quill editor
        const quill = new Quill('#editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['link', 'image'],
                    ['clean']
                ]
            }
        });

        // Column management
        let columns = [
            { id: 'todo', title: 'To Do', color: '#3b82f6' },
            { id: 'inProgress', title: 'In Progress', color: '#f59e0b' },
            { id: 'completed', title: 'Completed', color: '#10b981' },
            { id: 'blocked', title: 'Blocked', color: '#ef4444' }
        ];

        // Task Management
        let tasks = [
            {
                id: 'task1',
                title: 'Design Homepage',
                description: 'Create a modern and responsive homepage design',
                priority: 'high',
                status: 'todo',
                dueDate: '2024-03-25T15:00',
                assignee: {
                    id: '1',
                    name: 'John Doe',
                    color: '#3b82f6'
                },
                progress: 0,
                createdAt: '2024-03-20T10:00'
            },
            {
                id: 'task2',
                title: 'Implement API',
                description: 'Develop RESTful API endpoints for user management',
                priority: 'medium',
                status: 'inProgress',
                dueDate: '2024-03-28T17:00',
                assignee: {
                    id: '2',
                    name: 'Jane Smith',
                    color: '#10b981'
                },
                progress: 45,
                createdAt: '2024-03-19T09:00'
            },
            {
                id: 'task3',
                title: 'Write Documentation',
                description: 'Create comprehensive documentation for the project',
                priority: 'low',
                status: 'completed',
                dueDate: '2024-03-22T12:00',
                assignee: {
                    id: '1',
                    name: 'John Doe',
                    color: '#3b82f6'
                },
                progress: 100,
                createdAt: '2024-03-18T14:00'
            },
            {
                id: 'task4',
                title: 'Fix Login Bug',
                description: 'Resolve authentication issues in the login system',
                priority: 'high',
                status: 'blocked',
                dueDate: '2024-03-21T16:00',
                assignee: {
                    id: '2',
                    name: 'Jane Smith',
                    color: '#10b981'
                },
                progress: 30,
                createdAt: '2024-03-20T11:00'
            }
        ];

        // Current user role (defaults to employee)
        let userRole = 'employee';

        // Role-specific permissions
        const rolePermissions = {
            employee: {
                canCreateTask: true,
                canEditAssignedTask: true,
                canDeleteAssignedTask: false,
                canChangeTaskStatus: true,
                canAddColumn: false,
                canEditColumn: false,
                canDeleteColumn: false,
                canAssignTask: false,
                visibleStatuses: ['todo', 'inProgress', 'completed', 'blocked']
            },
            manager: {
                canCreateTask: true,
                canEditAnyTask: true,
                canDeleteAssignedTask: true,
                canChangeTaskStatus: true,
                canAddColumn: true,
                canEditColumn: true,
                canDeleteColumn: false,
                canAssignTask: true,
                visibleStatuses: ['todo', 'inProgress', 'completed', 'blocked']
            },
            admin: {
                canCreateTask: true,
                canEditAnyTask: true,
                canDeleteAnyTask: true,
                canChangeTaskStatus: true,
                canAddColumn: true,
                canEditColumn: true,
                canDeleteColumn: true,
                canAssignTask: true,
                visibleStatuses: ['todo', 'inProgress', 'completed', 'blocked']
            }
        };

        // Load tasks from localStorage if available
        const loadDataFromStorage = () => {
            const savedTasks = localStorage.getItem('tasks');
            if (savedTasks) {
                tasks = JSON.parse(savedTasks);
            }

            const savedColumns = localStorage.getItem('columns');
            if (savedColumns) {
                columns = JSON.parse(savedColumns);
            }
        };

        // Save data to localStorage
        const saveDataToStorage = () => {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            localStorage.setItem('columns', JSON.stringify(columns));
        };

        function generateTaskId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function saveTasks() {
            saveDataToStorage();
            updateTaskCounts();
        }

        function updateTaskStatus(taskId, newStatus) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                // Update task status based on role permissions
                if (userRole === 'employee' && task.assignee.id !== '1') { // Assuming current user is John Doe (id: 1)
                    alert("You can only update your own tasks!");
                    renderTasks(); // Re-render to revert UI
                    return;
                }
                
                task.status = newStatus;
                // If moving to completed, set progress to 100%
                if (newStatus === 'completed') {
                    task.progress = 100;
                }
                saveTasks();
                renderTasks();
            }
        }

        function getPriorityClass(priority) {
            return {
                high: 'bg-red-100 text-red-800',
                medium: 'bg-yellow-100 text-yellow-800',
                low: 'bg-green-100 text-green-800'
            }[priority];
        }

        function createTaskCard(task) {
            const card = document.createElement('div');
            card.className = `task-card priority-${task.priority}`;
            card.dataset.taskId = task.id;
            
            // Only make the card draggable if user has permission
            const canDrag = (
                (userRole === 'employee' && task.assignee.id === '1') || // Assuming current user is John Doe
                userRole === 'manager' ||
                userRole === 'admin'
            );
            
            card.draggable = canDrag;

            const dueDate = new Date(task.dueDate);
            const now = new Date();
            const daysUntilDue = Math.ceil((dueDate - now) / (1000 * 60 * 60 * 24));
            const dueDateClass = daysUntilDue < 0 ? 'text-red-600' : 
                               daysUntilDue <= 2 ? 'text-yellow-600' : 'text-gray-600';

            // Action buttons based on role permissions
            let actionButtons = '';
            
            if (
                (userRole === 'employee' && task.assignee.id === '1') || // Assuming current user is John Doe
                userRole === 'manager' ||
                userRole === 'admin'
            ) {
                actionButtons += `
                    <button onclick="editTask('${task.id}')" class="text-gray-500 hover:text-gray-700">
                        <i class="bi bi-pencil"></i>
                    </button>
                `;
            }
            
            if (
                (userRole === 'manager' && task.assignee.id === '1') || // Managers can delete tasks assigned to them
                userRole === 'admin'
            ) {
                actionButtons += `
                    <button onclick="deleteTask('${task.id}')" class="text-gray-500 hover:text-red-500">
                        <i class="bi bi-trash"></i>
                    </button>
                `;
            }

            card.innerHTML = `
                <div class="flex justify-between items-start mb-3">
                    <h4 class="font-semibold text-gray-700">${task.title}</h4>
                    <div class="flex gap-2">
                        ${actionButtons}
                    </div>
                </div>
                <div class="text-sm text-gray-600 mb-3">${task.description}</div>
                <div class="mb-3">
                    <div class="task-progress">
                        <div class="task-progress-bar" style="width: ${task.progress || 0}%"></div>
                    </div>
                    <div class="text-xs text-gray-500 mt-1">${task.progress || 0}% Complete</div>
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <div class="assignee-avatar" style="background-color: ${task.assignee.color || '#3b82f6'}">
                            ${task.assignee.name[0]}
                            <div class="assignee-tooltip">${task.assignee.name}</div>
                        </div>
                        <span class="text-sm ${dueDateClass}">
                            ${daysUntilDue < 0 ? 'Overdue' :
                              daysUntilDue === 0 ? 'Due today' :
                              daysUntilDue === 1 ? 'Due tomorrow' :
                              `Due in ${daysUntilDue} days`}
                        </span>
                    </div>
                    <span class="text-sm px-2 py-1 rounded-full ${getPriorityClass(task.priority)}">
                        ${task.priority}
                    </span>
                </div>
            `;

            return card;
        }

        function renderTasks() {
            // Clear current task counts
            document.querySelectorAll('.task-count-badge').forEach(badge => {
                badge.textContent = '0';
            });

            columns.forEach(column => {
                const columnEl = document.getElementById(`${column.id}Column`);
                if (!columnEl) return;
                
                const tasksList = columnEl.querySelector('.column-tasks');
                if (!tasksList) return;
                
                // Clear existing tasks
                tasksList.innerHTML = '';
                
                // Filter tasks for this column
                const filteredTasks = applyFilters(tasks).filter(task => task.status === column.id);
                
                // Update task count for this column
                const countBadge = columnEl.querySelector('.task-count-badge');
                if (countBadge) {
                    countBadge.textContent = filteredTasks.length.toString();
                }
                
                // Add tasks to column
                filteredTasks.forEach(task => {
                    const taskCard = createTaskCard(task);
                    tasksList.appendChild(taskCard);
                });
            });
        }

        function addTask(task) {
            tasks.push(task);
            saveTasks();
            renderTasks();
        }

        function editTask(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                // Check if user has permission to edit this task
                if (
                    userRole === 'employee' && task.assignee.id !== '1' && // Assuming current user is John Doe
                    userRole !== 'manager' &&
                    userRole !== 'admin'
                ) {
                    alert("You don't have permission to edit this task!");
                    return;
                }
                
                // Set form values
                document.getElementById('taskIdField').value = task.id;
                document.getElementById('taskModalTitle').textContent = 'Edit Task';
                document.querySelector('[name="title"]').value = task.title;
                quill.root.innerHTML = task.description;
                document.querySelector('[name="priority"]').value = task.priority;
                document.querySelector('[name="status"]').value = task.status;
                document.querySelector('[name="dueDate"]').value = task.dueDate;
                document.querySelector('[name="assignee"]').value = task.assignee.id;
                document.querySelector('[name="progress"]').value = task.progress || 0;
                document.querySelector('[name="progress"]').nextElementSibling.textContent = (task.progress || 0) + '%';

                document.getElementById('taskModal').classList.remove('hidden');
            }
        }

        function deleteTask(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                // Check if user has permission to delete this task
                if (
                    userRole === 'employee' || 
                    (userRole === 'manager' && task.assignee.id !== '1') // Managers can only delete their own tasks
                ) {
                    alert("You don't have permission to delete this task!");
                    return;
                }
                
                if (confirm('Are you sure you want to delete this task?')) {
                    tasks = tasks.filter(task => task.id !== taskId);
                    saveTasks();
                    renderTasks();
                }
            }
        }

        function updateTaskCounts() {
            document.getElementById('totalTasks').textContent = tasks.length;
            document.getElementById('inProgressTasks').textContent = tasks.filter(t => t.status === 'inProgress').length;
            document.getElementById('completedTasks').textContent = tasks.filter(t => t.status === 'completed').length;
            document.getElementById('blockedTasks').textContent = tasks.filter(t => t.status === 'blocked').length;
        }

        function applyFilters(tasksList) {
            const search = document.getElementById('taskSearch').value.toLowerCase();
            const assignee = document.getElementById('assigneeFilter').value;
            const priority = document.getElementById('priorityFilter').value;
            const date = document.getElementById('dateFilter').value;

            return tasksList.filter(task => {
                const matchesSearch = !search || 
                    task.title.toLowerCase().includes(search) || 
                    task.description.toLowerCase().includes(search);
                    
                const matchesAssignee = !assignee || task.assignee.id === assignee;
                const matchesPriority = !priority || task.priority === priority;

                const now = new Date();
                const dueDate = new Date(task.dueDate);
                const matchesDate = !date ||
                    (date === 'today' && dueDate.toDateString() === now.toDateString()) ||
                    (date === 'week' && (dueDate - now) / (1000 * 60 * 60 * 24) <= 7) ||
                    (date === 'overdue' && dueDate < now);

                return matchesSearch && matchesAssignee && matchesPriority && matchesDate;
            });
        }

        // Function to create column
        function createColumn(column) {
            const columnEl = document.createElement('div');
            columnEl.className = 'kanban-column';
            columnEl.id = `${column.id}Column`;
            columnEl.dataset.columnId = column.id;
            
            // Build column header with action buttons based on role
            let columnActions = '';
            
            if (userRole === 'manager' || userRole === 'admin') {
                columnActions = `
                    <div class="column-actions">
                        <button class="column-toggle" onclick="editColumn('${column.id}')">
                            <i class="bi bi-gear"></i>
                        </button>
                        <button class="column-toggle" onclick="toggleColumn('${column.id}')">
                            <i class="bi bi-chevron-left"></i>
                        </button>
                    </div>
                `;
            } else {
                columnActions = `
                    <div class="column-actions">
                        <button class="column-toggle" onclick="toggleColumn('${column.id}')">
                            <i class="bi bi-chevron-left"></i>
                        </button>
                    </div>
                `;
            }
            
            columnEl.innerHTML = `
                <div class="column-header">
                    <div class="flex items-center gap-2">
                        <h3 class="text-lg font-semibold" style="color: ${column.color}">${column.title}</h3>
                        <span class="neo-box px-2 py-1 text-sm text-gray-600 task-count-badge">0</span>
                    </div>
                    ${columnActions}
                </div>
                <div class="column-content">
                    <div class="column-tasks space-y-4" id="${column.id}Tasks"></div>
                </div>
            `;

            return columnEl;
        }

        // Function to render columns
        function renderColumns() {
            const board = document.getElementById('kanbanBoard');
            board.innerHTML = '';

            // Filter columns based on role permissions
            const visibleColumns = columns.filter(column => 
                rolePermissions[userRole].visibleStatuses.includes(column.id)
            );

            visibleColumns.forEach(column => {
                const columnEl = createColumn(column);
                board.appendChild(columnEl);
            });

            // Initialize Sortable for each column
            visibleColumns.forEach(column => {
                const columnTasksEl = document.getElementById(`${column.id}Tasks`);
                if (columnTasksEl) {
                    new Sortable(columnTasksEl, {
                        group: 'tasks',
                        animation: 150,
                        onStart: function(evt) {
                            const taskId = evt.item.dataset.taskId;
                            const task = tasks.find(t => t.id === taskId);
                            
                            // Check if user can drag this task
                            if (
                                (userRole === 'employee' && task && task.assignee.id !== '1') // Assuming current user is John Doe
                            ) {
                                // Cancel the drag operation
                                this.option('disabled', true);
                                setTimeout(() => {
                                    this.option('disabled', false);
                                }, 0);
                                return false;
                            }
                        },
                        onEnd: function(evt) {
                            const taskId = evt.item.dataset.taskId;
                            const newStatus = evt.to.id.replace('Tasks', '');
                            updateTaskStatus(taskId, newStatus);
                        }
                    });
                }
            });
        }

        // Function to toggle column collapse
        function toggleColumn(columnId) {
            const column = document.getElementById(`${columnId}Column`);
            if (column) {
                column.classList.toggle('collapsed');
            }
        }

        // Function to edit column
        function editColumn(columnId) {
            const column = columns.find(c => c.id === columnId);
            if (column) {
                // Check permission
                if (userRole === 'employee') {
                    alert("You don't have permission to edit columns!");
                    return;
                }
                
                document.getElementById('columnIdField').value = column.id;
                document.querySelector('[name="columnTitle"]').value = column.title;
                document.querySelector('[name="columnColor"]').value = column.color;
                
                // Show delete button only for admins
                const deleteBtn = document.getElementById('deleteColumn');
                deleteBtn.style.display = userRole === 'admin' ? 'block' : 'none';
                
                document.getElementById('columnModal').classList.remove('hidden');
            }
        }

        // Function to add a new column
        function addColumn(columnData) {
            // Check permission
            if (userRole === 'employee') {
                alert("You don't have permission to add columns!");
                return;
            }
            
            const newColumn = {
                id: columnData.id || 'column-' + Date.now().toString(36),
                title: columnData.title,
                color: columnData.color
            };
            
            columns.push(newColumn);
            saveDataToStorage();
            renderColumns();
            renderTasks();
        }

        // Function to update a column
        function updateColumn(columnId, columnData) {
            const column = columns.find(c => c.id === columnId);
            if (column) {
                column.title = columnData.title;
                column.color = columnData.color;
                saveDataToStorage();
                renderColumns();
                renderTasks();
            }
        }

        // Function to delete a column
        function deleteColumnById(columnId) {
            // Check permission
            if (userRole !== 'admin') {
                alert("You don't have permission to delete columns!");
                return;
            }
            
            // Check if there are tasks in this column
            const tasksInColumn = tasks.filter(t => t.status === columnId).length;
            if (tasksInColumn > 0) {
                alert(`Cannot delete column with ${tasksInColumn} tasks. Please move or delete the tasks first.`);
                return;
            }
            
            if (confirm('Are you sure you want to delete this column?')) {
                columns = columns.filter(c => c.id !== columnId);
                saveDataToStorage();
                renderColumns();
            }
        }

        // Function to switch between different user roles
        function switchRole(role) {
            if (['employee', 'manager', 'admin'].includes(role)) {
                userRole = role;
                
                // Show/hide elements based on role
                const addColumnBtn = document.getElementById('addColumnBtn');
                addColumnBtn.style.display = (role === 'employee') ? 'none' : 'block';
                
                renderColumns();
                renderTasks();
                alert(`Switched to ${role} view mode.`);
            }
        }

        // Form submission handlers
        document.getElementById('taskForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const taskId = formData.get('taskId');
            
            const taskData = {
                title: formData.get('title'),
                description: quill.root.innerHTML,
                priority: formData.get('priority'),
                status: formData.get('status'),
                dueDate: formData.get('dueDate'),
                assignee: {
                    id: formData.get('assignee'),
                    name: document.querySelector('[name="assignee"] option:checked').textContent,
                    color: formData.get('assignee') === '1' ? '#3b82f6' : '#10b981'
                },
                progress: parseInt(formData.get('progress'), 10) || 0
            };

            if (taskId) {
                // Update existing task
                const task = tasks.find(t => t.id === taskId);
                if (task) {
                    Object.assign(task, taskData);
                }
            } else {
                // Create new task
                const newTask = {
                    id: generateTaskId(),
                    ...taskData,
                    createdAt: new Date().toISOString()
                };
                tasks.push(newTask);
            }
            
            saveTasks();
            renderTasks();
            e.target.reset();
            quill.root.innerHTML = '';
            document.getElementById('taskModal').classList.add('hidden');
            document.getElementById('taskIdField').value = '';
            document.getElementById('taskModalTitle').textContent = 'Add New Task';
        });

        document.getElementById('columnForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const columnId = formData.get('columnId');
            
            const columnData = {
                title: formData.get('columnTitle'),
                color: formData.get('columnColor')
            };
            
            if (columnId) {
                updateColumn(columnId, columnData);
            } else {
                addColumn(columnData);
            }
            
            e.target.reset();
            document.getElementById('columnModal').classList.add('hidden');
            document.getElementById('columnIdField').value = '';
        });

        // DOM event handlers
        document.getElementById('addTaskBtn').addEventListener('click', () => {
            // Check role permission
            if (!rolePermissions[userRole].canCreateTask) {
                alert("You don't have permission to create new tasks!");
                return;
            }
            
            // Clear any previous form data
            document.getElementById('taskForm').reset();
            quill.root.innerHTML = '';
            document.getElementById('taskIdField').value = '';
            document.getElementById('taskModalTitle').textContent = 'Add New Task';
            
            // Default to current user as assignee for employee role
            if (userRole === 'employee') {
                document.querySelector('[name="assignee"]').value = '1'; // Assuming John Doe
            }
            
            document.getElementById('taskModal').classList.remove('hidden');
        });

        document.getElementById('addColumnBtn').addEventListener('click', () => {
            // Check role permission
            if (!rolePermissions[userRole].canAddColumn) {
                alert("You don't have permission to add new columns!");
                return;
            }
            
            // Clear form
            document.getElementById('columnForm').reset();
            document.getElementById('columnIdField').value = '';
            document.getElementById('deleteColumn').style.display = 'none';
            
            document.getElementById('columnModal').classList.remove('hidden');
        });

        document.getElementById('closeTaskModal').addEventListener('click', () => {
            document.getElementById('taskModal').classList.add('hidden');
        });

        document.getElementById('cancelTask').addEventListener('click', () => {
            document.getElementById('taskModal').classList.add('hidden');
        });

        document.getElementById('cancelColumn').addEventListener('click', () => {
            document.getElementById('columnModal').classList.add('hidden');
        });

        document.getElementById('deleteColumn').addEventListener('click', () => {
            const columnId = document.getElementById('columnIdField').value;
            if (columnId) {
                deleteColumnById(columnId);
                document.getElementById('columnModal').classList.add('hidden');
            }
        });

        document.getElementById('sidebarToggle').addEventListener('click', () => {
            document.querySelector('.sidebar').classList.toggle('translate-x-0');
        });

        // Filter handlers
        document.getElementById('taskSearch').addEventListener('input', renderTasks);
        document.getElementById('assigneeFilter').addEventListener('change', renderTasks);
        document.getElementById('priorityFilter').addEventListener('change', renderTasks);
        document.getElementById('dateFilter').addEventListener('change', renderTasks);
        document.getElementById('clearFilters').addEventListener('click', () => {
            document.getElementById('taskSearch').value = '';
            document.getElementById('assigneeFilter').value = '';
            document.getElementById('priorityFilter').value = '';
            document.getElementById('dateFilter').value = '';
            renderTasks();
        });

        // File upload preview
        document.getElementById('attachments').addEventListener('change', function(e) {
            const previewContainer = document.getElementById('attachmentPreviews');
            previewContainer.innerHTML = '';

            Array.from(e.target.files).forEach(file => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const preview = document.createElement('img');
                        preview.src = e.target.result;
                        preview.className = 'attachment-preview';
                        previewContainer.appendChild(preview);
                    }
                    reader.readAsDataURL(file);
                } else {
                    const preview = document.createElement('div');
                    preview.className = 'neo-box p-2 text-sm text-gray-600';
                    preview.textContent = file.name;
                    previewContainer.appendChild(preview);
                }
            });
        });

        // Subtask management
        function addSubtask() {
            const subtasksList = document.getElementById('subtasksList');
            const subtaskInput = subtasksList.querySelector('input');
            const subtaskText = subtaskInput.value.trim();

            if (subtaskText) {
                const subtaskEl = document.createElement('div');
                subtaskEl.className = 'flex items-center gap-2';
                subtaskEl.innerHTML = `
                    <input type="checkbox" class="neo-box">
                    <span class="text-gray-700">${subtaskText}</span>
                    <button type="button" class="text-red-500 hover:text-red-700 ml-auto"
                            onclick="this.parentElement.remove()">
                        <i class="bi bi-x"></i>
                    </button>
                `;
                subtasksList.insertBefore(subtaskEl, subtaskInput.parentElement);
                subtaskInput.value = '';
            }
        }

        // Load initial data
        document.addEventListener('DOMContentLoaded', () => {
            loadDataFromStorage();
            // Default to employee view
            userRole = 'employee';
            
            // Hide add column button for employees
            document.getElementById('addColumnBtn').style.display = 'none';
            
            renderColumns();
            renderTasks();
            updateTaskCounts();
        });

        // Make addTask button visible by default
        document.getElementById('addTaskBtn').style.display = 'block';
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
